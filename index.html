<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decisiones en el Campus | Sostenibilidad UNSA (Versión D)</title>
  <meta name="description" content="Explora el costo real de tus decisiones cotidianas en el campus. Historia interactiva de sostenibilidad sin culpas (Versión D)." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="¿Tú qué harías en 5 segundos? | Historia Interactiva UNSA" />
  <meta property="og:description" content="Agua, energía y transporte en el campus. Elige tu camino y descubre cuál de los 3 finales obtienes." />
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #1a202c;
      --muted: #4a5568;
      --primary: #0056b3;
      --primary-hover: #003d82;
      --accent: #2f6f4e;
      --accent-soft: #eaf4ee;
      --warn-bg: #fff8eb;
      --warn-border: #d97706;
      --info-bg: #eff6ff;
      --info-border: #2563eb;
      --border: #cbd5e1;
      --tag-bg: #edf2f7;
      --focus: #e09f3e;
      --font-size: 18px;
    }
    body.dark {
      --bg: #0f1419;
      --card: #192129;
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent: #34d399;
      --accent-soft: #132a22;
      --warn-bg: #2a2112;
      --warn-border: #f59e0b;
      --info-bg: #17253b;
      --info-border: #60a5fa;
      --border: #334155;
      --tag-bg: #24303c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: var(--font-size);
      line-height: 1.6;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { font-size: 0.9rem; font-weight: 800; color: var(--accent); }
    .toolbar { display: flex; gap: 0.45rem; }
    .tool-btn {
      background: var(--tag-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    main { max-width: 780px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .step {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      opacity: 0.65;
    }
    .step.active { border: 2px solid var(--primary); color: var(--primary); opacity: 1; }
    .step.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); opacity: 1; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    }
    .top-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .node-badge {
      background: var(--tag-bg);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
    }
    .stage-badge {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--accent);
    }
    h1 { margin: 0 0 1rem; font-size: 1.5em; line-height: 1.25; }
    .context-box {
      background: var(--info-bg);
      border-left: 4px solid var(--info-border);
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
      margin-bottom: 1.1rem;
      font-size: 0.95em;
    }
    .context-title { font-weight: 800; font-size: 0.85em; text-transform: uppercase; display: block; margin-bottom: 0.25rem; }
    .triad-grid { display: flex; flex-direction: column; gap: 0.85rem; margin: 1rem 0; }
    .triad-item { padding: 0.95rem 1.1rem; border-radius: 8px; border-left: 4px solid var(--border); background: var(--tag-bg); font-size: 0.95em; }
    .triad-item.evidencia { background: var(--info-bg); border-left-color: var(--info-border); }
    .triad-item.interpretacion { background: var(--warn-bg); border-left-color: var(--warn-border); }
    .triad-item.accion { background: var(--accent-soft); border-left-color: var(--accent); }
    .triad-label { font-weight: 800; font-size: 0.85em; text-transform: uppercase; display: block; margin-bottom: 0.25rem; }
    .choices { display: flex; flex-direction: column; gap: 0.85rem; margin-top: 1.25rem; }
    .choice-btn {
      width: 100%;
      text-align: left;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      font-size: 0.98em;
      font-weight: 700;
      cursor: pointer;
    }
    .choice-btn:hover { background: var(--primary-hover); }
    .choice-cost {
      display: inline-block;
      background: rgba(0, 0, 0, 0.22);
      padding: 0.22rem 0.6rem;
      border-radius: 6px;
      font-size: 0.82em;
      font-weight: 500;
      margin-top: 0.45rem;
    }
    .summary-card { background: var(--tag-bg); border-radius: 10px; padding: 1.1rem 1.25rem; margin: 1.25rem 0; }
    .summary-row { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.92em; }
    .summary-row:last-child { border-bottom: none; }
    .pts-tag { font-weight: 800; background: var(--card); border: 1px solid var(--border); padding: 0.15rem 0.55rem; border-radius: 6px; white-space: nowrap; }
    footer { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🌱 UNSA · Sostenibilidad en Campus (Versión D)</div>
    <div class="toolbar">
      <button class="tool-btn" id="btn-dec" aria-label="Reducir texto">A-</button>
      <button class="tool-btn" id="btn-inc" aria-label="Aumentar texto">A+</button>
      <button class="tool-btn" id="btn-theme">🌙 Modo oscuro</button>
    </div>
  </header>

  <main>
    <nav class="stepper" aria-label="Progreso">
      <div class="step" id="step-1">1. 💧 Agua</div>
      <div class="step" id="step-2">2. 💡 Energía</div>
      <div class="step" id="step-3">3. 🚌 Transporte</div>
      <div class="step" id="step-4">4. 🏁 Resultado</div>
    </nav>
    <article class="card" id="story-container" aria-live="polite"></article>
    <footer>Taller de Narrativa Digital · EPIS-UNSA · 9 Nodos · 27 Rutas Verificadas</footer>
  </main>

  <script>
    const state = { agua: "", energia: "", transporte: "", puntos: 0, ptsAgua: 0, ptsEnergia: 0, ptsTransporte: 0 };
    const summaryLabels = {
      agua: {
        reportar: "Cerraste la llave de paso y avisaste a mantenimiento",
        cerrar: "Ajustaste la manija para reducir el chorro a goteo",
        ignorar: "Seguiste directo a tu examen sin intervenir"
      },
      energia: {
        todo: "Apagaste proyector y luces del aula vacía",
        luces: "Apagaste solo las luces y dejaste el proyector encendido",
        dejar: "Saliste rápido sin apagar equipos"
      },
      transporte: {
        bus: "Regresaste en bus / transporte público",
        compartido: "Coordinaste un taxi compartido con compañeros",
        solo: "Tomaste un taxi individual"
      }
    };

    function updateStepper(activeStep) {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById("step-" + i);
        el.className = "step" + (i < activeStep ? " done" : i === activeStep ? " active" : "");
      }
    }

    const nodes = {
      inicio: () => {
        updateStepper(1);
        return {
          badge: "Nodo 1 de 9 · Inicio",
          stage: "Introducción",
          title: "Un día cualquiera en el campus UNSA",
          html: `<div class="context-box"><span class="context-title">🎯 ¿Cómo funciona?</span>Vas a enfrentar <strong>3 situaciones reales</strong> en la universidad (agua, energía y transporte). Cada opción muestra de antemano qué información tienes y cuál es su <strong>costo real</strong> en tiempo, esfuerzo o comodidad.</div><p>No existen respuestas "perfectas" ni juicios: elige con total libertad según lo que harías en tu rutina y descubre qué desenlace generan tus decisiones al final del día.</p>`,
          choices: [{ text: "Comenzar recorrido (8:55 a. m. en el pabellón)", cost: "⏱️ Duración: 2 minutos · 3 decisiones cotidianas", action: () => render("decision_agua") }]
        };
      },
      decision_agua: () => {
        updateStepper(1);
        return {
          badge: "Nodo 2 de 9 · Decisión 1: Agua",
          stage: "Etapa 1 de 3",
          title: "El caño goteando antes del examen",
          html: `<div class="context-box"><span class="context-title">📋 Datos disponibles</span>Son las <strong>8:55 a. m.</strong> y tu práctica calificada empieza en <strong>5 minutos</strong>. Al pasar por los servicios del primer piso ves un caño abierto con chorro continuo. No hay nadie más en el pasillo.</div><p><strong>¿Qué decides hacer?</strong></p>`,
          choices: [
            { text: "1. Cerrar la llave de paso y avisar a mantenimiento en la puerta", cost: "⏱️ Costo: Pierdes 4 minutos de repaso y entras justo al límite", action: () => { state.agua = "reportar"; state.ptsAgua = 2; state.puntos += 2; render("consecuencia_agua"); } },
            { text: "2. Ajustar con fuerza la manija para reducir el chorro a un goteo leve", cost: "⏱️ Costo: 30 segundos y te mojas las manos antes del examen", action: () => { state.agua = "cerrar"; state.ptsAgua = 1; state.puntos += 1; render("consecuencia_agua"); } },
            { text: "3. Seguir directo al salón para asegurar tu sitio y repasar", cost: "⚡ Costo inmediato: 0 minutos para tu horario; el agua sigue corriendo", action: () => { state.agua = "ignorar"; state.ptsAgua = 0; state.puntos += 0; render("consecuencia_agua"); } }
          ]
        };
      },
      consecuencia_agua: () => {
        updateStepper(1);
        const data = {
          reportar: { evidencia: "El chorro se detuvo en menos de 2 minutos y mantenimiento anotó el cambio de empaque.", interpretacion: "Una fuga continua desperdicia más de 30 litros por hora en un pabellón; cortar el flujo temprano evita cientos de litros perdidos en el día.", accion: "Guardar el punto de reporte rápido del pabellón permite avisar en menos de 1 minuto la próxima vez." },
          cerrar: { evidencia: "El flujo fuerte bajó a un goteo lento y llegaste puntual a tu práctica.", interpretacion: "Redujiste gran parte del desperdicio inmediato, aunque la válvula dañada seguirá goteando hasta ser reparada.", accion: "Al salir de clase puedes dejar un aviso breve en conserjería para que cambien el empaque." },
          ignorar: { evidencia: "Llegaste a tiempo y repasaste tus apuntes. El caño siguió abierto durante toda la hora de clase.", interpretacion: "Priorizar un examen bajo presión de tiempo es comprensible, pero asumir que 'alguien más avisará' prolonga la pérdida por horas.", accion: "Incluso un reporte de 20 segundos al terminar tu evaluación sigue siendo útil para detener la pérdida." }
        }[state.agua];
        return {
          badge: "Nodo 3 de 9 · Consecuencia 1: Agua",
          stage: "Etapa 1 de 3",
          title: "Resultado de tu primera decisión",
          html: `<div class="triad-grid"><div class="triad-item evidencia"><span class="triad-label">🔍 Evidencia</span>${data.evidencia}</div><div class="triad-item interpretacion"><span class="triad-label">📊 Interpretación</span>${data.interpretacion}</div><div class="triad-item accion"><span class="triad-label">✅ Acción realizable</span>${data.accion}</div></div>`,
          choices: [{ text: "Continuar hacia la tarde en el campus →", cost: "Siguiente etapa: Uso de energía en aulas", action: () => render("decision_energia") }]
        };
      },
      decision_energia: () => {
        updateStepper(2);
        return {
          badge: "Nodo 4 de 9 · Decisión 2: Energía",
          stage: "Etapa 2 de 3",
          title: "El aula vacía al final de la jornada",
          html: `<div class="context-box"><span class="context-title">📋 Datos disponibles</span>Son las <strong>6:40 p. m.</strong> Regresas por tu cuaderno olvidado en un salón vacío: los fluorescentes y el proyector siguen encendidos. Tu último bus directo pasa en pocos minutos.</div><p><strong>¿Qué decides hacer?</strong></p>`,
          choices: [
            { text: "1. Apagar el proyector con el control, bajar las luces y cerrar la puerta", cost: "⏱️ Costo: 2 minutos extra de esfuerzo; arriesgas perder el primer bus", action: () => { state.energia = "todo"; state.ptsEnergia = 2; state.puntos += 2; render("consecuencia_energia"); } },
            { text: "2. Apagar solo las luces junto a la puerta y dejar el proyector encendido", cost: "⏱️ Costo: 10 segundos al salir; no te desvías de tu ruta", action: () => { state.energia = "luces"; state.ptsEnergia = 1; state.puntos += 1; render("consecuencia_energia"); } },
            { text: "3. Recoger tu cuaderno y salir rápido sin tocar los interruptores", cost: "⚡ Costo inmediato: 0 segundos; aseguras alcanzar tu bus", action: () => { state.energia = "dejar"; state.ptsEnergia = 0; state.puntos += 0; render("consecuencia_energia"); } }
          ]
        };
      },
      consecuencia_energia: () => {
        updateStepper(2);
        const data = {
          todo: { evidencia: "El aula quedó sin consumo activo y el ventilador del proyector completó su enfriamiento seguro.", interpretacion: "Evitaste aproximadamente 450 watts/hora de gasto innecesario y protegiste la vida útil de la lámpara del equipo.", accion: "Acordar con el delegado del salón una verificación de 20 segundos al terminar la última clase multiplica este ahorro." },
          luces: { evidencia: "Los fluorescentes se apagaron, pero el proyector siguió proyectando luz azul durante varias horas.", interpretacion: "Redujiste cerca de la mitad del gasto del salón, aunque un proyector en vacío consume unos 250 watts por hora.", accion: "Ubicar el botón de apagado rápido antes de salir convierte esta acción en un gesto automático." },
          dejar: { evidencia: "El aula permaneció con luces y proyector activos hasta la ronda nocturna, consumiendo entre 300 y 450 watts/hora sin uso.", interpretacion: "Sumado entre varios salones vacíos, este consumo representa una fracción importante del gasto eléctrico del pabellón.", accion: "Bajar al menos el interruptor de luz al ser la última persona en salir toma menos de 5 segundos." }
        }[state.energia];
        return {
          badge: "Nodo 5 de 9 · Consecuencia 2: Energía",
          stage: "Etapa 2 de 3",
          title: "Balance energético del aula",
          html: `<div class="triad-grid"><div class="triad-item evidencia"><span class="triad-label">🔍 Evidencia</span>${data.evidencia}</div><div class="triad-item interpretacion"><span class="triad-label">📊 Interpretación (Datos en Watts)</span>${data.interpretacion}</div><div class="triad-item accion"><span class="triad-label">✅ Acción realizable</span>${data.accion}</div></div>`,
          choices: [{ text: "Salir del campus rumbo a casa →", cost: "Última etapa: Movilidad urbana", action: () => render("decision_transporte") }]
        };
      },
      decision_transporte: () => {
        updateStepper(3);
        return {
          badge: "Nodo 6 de 9 · Decisión 3: Transporte",
          stage: "Etapa 3 de 3",
          title: "El regreso a casa en hora punta",
          html: `<div class="context-box"><span class="context-title">📋 Datos disponibles</span>Estás en la puerta de la universidad con la mochila pesada y hace frío. Dos compañeros de tu misma zona también salen hacia el paradero.</div><p><strong>¿Cómo eliges volver hoy?</strong></p>`,
          choices: [
            { text: "1. Esperar el bus o combi de transporte público", cost: "🚌 Costo: 35 min de viaje y menos comodidad; mínima emisión por pasajero", action: () => { state.transporte = "bus"; state.ptsTransporte = 2; state.puntos += 2; goToFinal(); } },
            { text: "2. Proponer un taxi compartido con tus dos compañeros de ruta", cost: "🚕 Costo: Coordinar 5 min de espera y dividir el pasaje entre tres", action: () => { state.transporte = "compartido"; state.ptsTransporte = 1; state.puntos += 1; goToFinal(); } },
            { text: "3. Tomar un taxi individual de inmediato", cost: "💸 Costo: Mayor gasto económico y un auto extra en hora punta, pero llegas en 15 min", action: () => { state.transporte = "solo"; state.ptsTransporte = 0; state.puntos += 0; goToFinal(); } }
          ]
        };
      },
      final_a: () => {
        updateStepper(4);
        return {
          badge: "Nodo 7 de 9 · Final A",
          stage: `Resultado: ${state.puntos} / 6 pts`,
          title: "Acciones que dejan huella",
          html: `<p>Asumiste costos reales de tiempo y esfuerzo en casi todas las situaciones del día. Tu recorrido demuestra que la sostenibilidad en el campus no depende de gestos extraordinarios, sino de decisiones consistentes incluso cuando nadie observa.</p>${buildSummary()}<div class="triad-item accion"><span class="triad-label">✅ Siguiente paso realizable</span>Comparte un hábito sencillo (como reportar fugas o coordinar retornos compartidos) con tu grupo de estudio esta semana.</div>`,
          choices: [{ text: "🔄 Volver a empezar y probar otra ruta", cost: "Reinicia el recorrido desde el inicio", action: resetStory }]
        };
      },
      final_b: () => {
        updateStepper(4);
        return {
          badge: "Nodo 8 de 9 · Final B",
          stage: `Resultado: ${state.puntos} / 6 pts`,
          title: "Avances parciales",
          html: `<p>Equilibraste tus tiempos personales con acciones concretas en algunos momentos y soluciones intermedias en otros. Este es el escenario más habitual en la vida universitaria: ya aplicas hábitos útiles, pero tienes margen claro para reducir impacto sin complicar tu rutina.</p>${buildSummary()}<div class="triad-item accion"><span class="triad-label">✅ Siguiente paso realizable</span>Identifica cuál de las tres decisiones de hoy te resultó más fácil de sostener y conviértela en tu estándar diario.</div>`,
          choices: [{ text: "🔄 Volver a empezar y probar otra ruta", cost: "Reinicia el recorrido desde el inicio", action: resetStory }]
        };
      },
      final_c: () => {
        updateStepper(4);
        return {
          badge: "Nodo 9 de 9 · Final C",
          stage: `Resultado: ${state.puntos} / 6 pts`,
          title: "Un día para retomar",
          html: `<p>Hoy priorizaste la rapidez y la comodidad inmediata frente a la presión del horario. Lejos de buscar culpas, este resultado hace visible cómo la rutina automática suele desplazar pequeñas acciones que apenas toman unos segundos.</p>${buildSummary()}<div class="triad-item accion"><span class="triad-label">✅ Siguiente paso realizable</span>Mañana elige solo una acción de bajo costo (como apagar las luces al salir de un aula o avisar por una fuga) y comprueba cuánto tiempo toma realmente.</div>`,
          choices: [{ text: "🔄 Volver a empezar y probar otra ruta", cost: "Reinicia el recorrido desde el inicio", action: resetStory }]
        };
      }
    };

    function buildSummary() {
      return `<div class="summary-card"><strong>📋 Desglose de tus decisiones (Total: ${state.puntos} / 6 puntos):</strong><div class="summary-row"><span><strong>💧 Agua:</strong> ${summaryLabels.agua[state.agua]}</span><span class="pts-tag">+${state.ptsAgua} pts</span></div><div class="summary-row"><span><strong>💡 Energía:</strong> ${summaryLabels.energia[state.energia]}</span><span class="pts-tag">+${state.ptsEnergia} pts</span></div><div class="summary-row"><span><strong>🚌 Transporte:</strong> ${summaryLabels.transporte[state.transporte]}</span><span class="pts-tag">+${state.ptsTransporte} pts</span></div></div>`;
    }
    function goToFinal() {
      if (state.puntos >= 5) render("final_a");
      else if (state.puntos >= 3) render("final_b");
      else render("final_c");
    }
    function resetStory() {
      Object.assign(state, { agua: "", energia: "", transporte: "", puntos: 0, ptsAgua: 0, ptsEnergia: 0, ptsTransporte: 0 });
      render("inicio");
    }
    function render(nodeKey) {
      const container = document.getElementById("story-container");
      const data = nodes[nodeKey]();
      container.innerHTML = `<div class="top-meta"><span class="node-badge">${data.badge}</span><span class="stage-badge">${data.stage}</span></div><h1>${data.title}</h1><div>${data.html}</div><div class="choices" id="choices-box"></div>`;
      const choicesBox = document.getElementById("choices-box");
      data.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerHTML = `${choice.text}<br><span class="choice-cost">${choice.cost}</span>`;
        btn.addEventListener("click", choice.action);
        choicesBox.appendChild(btn);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    let fontSize = 18;
    document.getElementById("btn-inc").addEventListener("click", () => { if (fontSize < 26) { fontSize += 2; document.documentElement.style.setProperty("--font-size", fontSize + "px"); } });
    document.getElementById("btn-dec").addEventListener("click", () => { if (fontSize > 14) { fontSize -= 2; document.documentElement.style.setProperty("--font-size", fontSize + "px"); } });
    const themeBtn = document.getElementById("btn-theme");
    themeBtn.addEventListener("click", () => { const isDark = document.body.classList.toggle("dark"); themeBtn.textContent = isDark ? "☀️ Modo claro" : "🌙 Modo oscuro"; });

    render("inicio");
  </script>
</body>
</html>
